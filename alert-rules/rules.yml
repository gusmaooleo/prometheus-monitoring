groups:
- name: saffira-alerts
  rules:

  - alert: backend_down
    expr: up{job="saffira_backend"} == 0
    for: 5s
    labels:
      severity: critical
      service: backend
    annotations:
      summary: "Saffira Backend está fora do ar"
      description: "O backend não responde ao Prometheus há 5 segundos"

  - alert: external_api_down
    expr: rate(external_api_down{api="saffira_yolov4"}[30s]) == 1
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Falha na integração com API externa"
      description: "Erros detectados ao chamar api_externa"

  - alert: camera_offline
    expr: camera_offline{job="saffira_backend"} == 1
    for: 30s
    labels:
      severity: critical
      service: cameras
    annotations:
      summary: "Câmera offline: {{ $labels.cameraName }}"
      description: "A câmera {{ $labels.cameraName }} (IP {{ $labels.cameraIp }}) está offline há pelo menos 30 segundos"
